<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#143844">
<title>CME Digital</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CME">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="pular" href="#tela">Ir para o conteúdo</a>

<header class="topo">
  <button id="abrir-menu" class="ico menu" aria-label="Abrir menu">
    <span></span><span></span><span></span>
  </button>
  <div class="topo-txt">
    <span class="topo-marca">CME Digital</span>
    <h1 id="titulo">CME Hoje</h1>
  </div>
</header>

<nav class="nav" aria-label="Seções">
  <p class="nav-tit">Operação</p>
  <button class="nav-item" data-rota="hoje">CME Hoje</button>
  <button class="nav-item" data-rota="cargas">Cargas</button>
  <button class="nav-item" data-rota="checklist">Checklist diário</button>
  <p class="nav-tit">Cadastros</p>
  <button class="nav-item" data-rota="equipamentos">Equipamentos</button>
  <button class="nav-item" data-rota="pps">PPS e embalagem</button>
  <button class="nav-item" data-rota="ifus">IFUs dos fabricantes</button>
  <button class="nav-item" data-rota="insumos">Insumos e estoque</button>
  <p class="nav-tit">Qualidade</p>
  <button class="nav-item" data-rota="agua">Qualidade da água</button>
  <button class="nav-item" data-rota="nc">Não conformidades</button>
  <button class="nav-item" data-rota="ajustes">Ajustes</button>
  <p class="nav-rodape">Enfª Juliana Lima da Rocha<br><span>Responsável pelo CME</span></p>
</nav>
<div class="nav-fundo"></div>

<main id="tela" tabindex="-1"></main>

<div id="abertura" class="abertura">
  <div class="abertura-caixa">
    <svg class="curva" viewBox="0 0 320 130" aria-hidden="true">
      <line class="curva-base" x1="8" y1="104" x2="312" y2="104"/>
      <line class="curva-plato" x1="34" y1="34" x2="286" y2="34"/>
      <path class="curva-traco"
            d="M12,104 C 52,104 74,36 112,34 L 208,34 C 248,34 268,86 308,96"/>
      <circle class="curva-halo" cx="308" cy="96" r="5"/>
      <circle class="curva-ponto" cx="308" cy="96" r="5"/>
      <text class="curva-rot" x="34" y="26">134 °C</text>
    </svg>
    <p class="abertura-marca">CME Digital</p>
    <p class="abertura-sub">Central de Material e Esterilização</p>
    <p id="carregando" class="abertura-estado">Abrindo o banco local…</p>
  </div>
</div>
<div id="aviso" class="aviso" role="status" aria-live="polite"></div>

<script src="vendor/qrcode.js"></script>
<script src="db.js"></script>
<script src="core.js"></script>
<script src="motor.js"></script>
<script src="seed.js"></script>
<script src="mod-hoje.js"></script>
<script src="mod-cargas.js"></script>
<script src="mod-equipamentos.js"></script>
<script src="mod-pps.js"></script>
<script src="mod-ifu.js"></script>
<script src="mod-apoio.js"></script>
<script src="mod-checklist.js"></script>
<script>
  document.querySelector('.nav-fundo').addEventListener('click', function () {
    document.body.classList.remove('menu-aberto');
  });
  CME.iniciar();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
